name: Vercel Preview Deployment

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  deploy-preview:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Vercelチームに紐づくauthorで一時的にbuildする。
      # GitHub上の履歴は変更しない。
      - name: Override commit author
        run: |
          git config user.name "${{ secrets.VERCEL_GIT_NAME }}"
          git config user.email "${{ secrets.VERCEL_GIT_EMAIL }}"
          git commit --amend --no-edit --reset-author --allow-empty

      - name: Show commit info
        run: git log -1 --pretty=fuller

      - name: Install Vercel CLI
        run: npm install --global vercel@59.11.2

      - name: Check Vercel Authentication
        run: |
          vercel whoami \
            --token="${{ secrets.VERCEL_TOKEN }}"

      - name: Check Vercel Project Access
        run: |
          vercel project inspect mikan-sns \
            --scope=mshuto1227-2620s-projects \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # Projectとのリンク情報を取得する。Sensitiveな環境変数は
      # GitHub Actionsへpullできないため、ここではローカルbuildしない。
      - name: Pull Vercel Project Configuration
        run: |
          vercel pull \
            --yes \
            --environment=preview \
            --token="${{ secrets.VERCEL_TOKEN }}"

      # ソースをVercelへ送り、Preview環境変数を利用してVercel上でbuildする。
      - name: Deploy Preview
        id: deploy
        shell: bash
        run: |
          deployment_url="$(vercel deploy \
            --yes \
            --token="${{ secrets.VERCEL_TOKEN }}")"
          echo "url=${deployment_url}" >> "${GITHUB_OUTPUT}"
          echo "Preview deployed to ${deployment_url}"

      - name: Publish Preview URL
        shell: bash
        run: |
          {
            echo "## Vercel Preview"
            echo ""
            echo "- URL: ${{ steps.deploy.outputs.url }}"
            echo "- Source commit: ${GITHUB_SHA}"
            echo "- Branch: ${GITHUB_REF_NAME}"
          } >> "${GITHUB_STEP_SUMMARY}"
